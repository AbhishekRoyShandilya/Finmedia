# Union Budget case library - the analogue set for the fiscal/policy playbook.
#
# DATES verified 2026-09-27 against two independent checks:
#   1. published lists (Wikipedia "Union budget of India"; indiabudget.gov.in speech PDFs; official announcements
#      for 2024-07-23 and 2004-02-03 - the Wikipedia list had 2024-07-22 and 2004-02-04, both WRONG);
#   2. the PTIS all-NSE panel: every date is a trading session, including the Saturday / Sunday special
#      sessions NSE opens only for budgets (1999, 2015, 2020, 2025, 2026).
# Not yet included: the 1998-03-25 interim budget (unverified).
#
# session: the NSE session on which the speech landed (speeches start ~11:00 IST, so the budget day's close
# already contains the reaction; event studies measure from the PREVIOUS close).
# tags: sector-level announcements, to be proposed by the Case Extractor from the budget speech (with quotes)
# and APPROVED by a human (gate G1). Empty until approved - only approved tags may feed analogue selection.

source_notes:
