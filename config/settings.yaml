# Finmedia runtime settings.
# Secrets never go here: the Claude API key comes from the ANTHROPIC_API_KEY
# environment variable (or an `ant auth login` profile).

budget:
  # All-in monthly cap decided 26 Sep 2026 (docs/budget-lean-launch.md §10).
  monthly_cap_inr: 12000
  # Share of the cap the Claude API may use. The rest is for fixed
  # subscriptions (voice, avatar, server) recorded with `finmedia costs add`.
  llm_cap_inr: 2600
  # Deep Research Desk pool (research_* roles), SEPARATE from the media cap above.
  # PLACEHOLDER pending the owner's confirmation (plan proposed Rs10-15k/month).
  research_llm_cap_inr: 12000
  usd_inr: 88.0              # conversion used for cost reporting; update monthly

llm:
  # Model per pipeline role. Defaults to Claude Opus 5 everywhere. To trade
  # quality for cost on high-volume triage, change `triage` to
  # claude-sonnet-5 or claude-haiku-4-5 after measuring quality.
  models:
    triage: claude-opus-5
    brief: claude-opus-5
    reel_script: claude-opus-5
    research_scoper: claude-opus-5
    research_facts: claude-opus-5
    research_persona: claude-opus-5
    research_skeptic: claude-opus-5
    research_cio: claude-opus-5
  effort:                    # low | medium | high | xhigh | max
    triage: low
    brief: high
    reel_script: high
    research_scoper: medium
    research_facts: medium
    research_persona: high
    research_skeptic: high
    research_cio: high
  max_tokens:
    triage: 2000
    brief: 8000
    reel_script: 8000
    research_scoper: 3000
    research_facts: 8000
    research_persona: 6000
    research_skeptic: 5000
    research_cio: 10000
  # Server-side refusal fallback (beta). Routes a declined request to a
  # fallback model automatically. Set to false to disable.
  refusal_fallbacks: true
  # USD per 1M tokens (input, output). Cache writes bill at 1.25x input,
  # cache reads at 0.1x input. Update when Anthropic pricing changes.
  prices_usd_per_mtok:
    claude-opus-5: [5.00, 25.00]
    claude-opus-5-5: [4.00, 20.00]
    claude-sonnet-5: [2.00, 10.00]
    claude-haiku-4-5: [1.00, 5.00]
    claude-opus-4-8: [5.00, 25.00]
  # Characters of source document sent to each role (keeps cost bounded).
  max_doc_chars:
    triage: 6000
    brief: 40000
    research_facts: 60000

agent:
  # Who runs the lead researcher, the analyst panel and the content writers.
  #   anthropic      - Claude (key: ANTHROPIC_API_KEY)
  #   openai_compat  - any OpenAI-compatible chat API with tool calling: Groq, OpenAI, OpenRouter, Together,
  #                    a local Ollama... (key: OPENAI_COMPAT_API_KEY; set base_url and models below)
  #   demo           - no LLM: a scripted walk-through that calls real tools, to check the whole app works.
  #                    Its output is NOT research.
  provider: anthropic
  anthropic:
    models:
      research_lead: claude-opus-5-5
      research_panel: claude-opus-5-5
      content_writer: claude-opus-5-5
    effort: {research_lead: high, research_panel: high, content_writer: high}
  openai_compat:
    base_url: https://api.groq.com/openai/v1
    models:
      research_lead: openai/gpt-oss-120b
      research_panel: openai/gpt-oss-120b
      content_writer: openai/gpt-oss-120b
    # USD per 1M tokens (input, output) for the models above, for the budget guard. Update to your provider.
    prices_usd_per_mtok:
      openai/gpt-oss-120b: [0.15, 0.75]
  max_tokens: {research_lead: 8000, research_panel: 4000, content_writer: 8000}
  # Research depth presets: tool-using steps and a hard rupee cap per run (on top of the monthly research cap).
  depth:
    quick: {max_steps: 12, budget_inr: 150}
    standard: {max_steps: 25, budget_inr: 400}
    deep: {max_steps: 45, budget_inr: 1000}
  tool_result_chars: 6000        # a tool result longer than this is cut in the model's context (kept in full in the log)
  parallel_tools: 4

server:
  host: 127.0.0.1
  port: 8020

collectors:
  enabled: true                  # the web server runs due collectors in the background
  default_interval_min: 60
  postmortem_hour: 18            # score due claims once a day after this local hour
  alert_after_failures: 3        # Telegram alert when a source fails this many times in a row

pipeline:
  db_path: data/finmedia.db
  output_dir: output
  inbox_dir: data/inbox
  # Only documents with a pre-filter score at or above this reach the LLM.
  prefilter_min_score: 3
  # Maximum documents triaged by the LLM per run (hard volume cap).
  triage_limit_per_run: 25
  # Minimum triage materiality for a document to get a research brief.
  brief_min_materiality: 60
