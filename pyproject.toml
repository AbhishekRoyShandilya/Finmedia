[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finmedia"
version = "0.2.0"
description = "Research desk and content engine for evidence-based Indian market research"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "pypdf>=4.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
finmedia = "finmedia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
